[workspace]
resolver = "3"
members = ["crates/tree-assets", "crates/pob-import", "crates/pob-engine", "crates/pob-core", "crates/pobng-ffi", "crates/pobng-ios"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
egui = "0.36.1"

# Decoding is block-by-block over multi-megabyte textures; an unoptimised
# build makes the prototype feel broken. Optimise deps, keep ours debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

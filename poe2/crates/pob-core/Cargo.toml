[package]
name = "pob-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
egui.workspace = true
pob-engine = { path = "../pob-engine" }
pob-import = { path = "../pob-import" }
# PoB2 node icons: resolve an icon key through ddsCoords and decode the slice.
tree-assets = { path = "../tree-assets" }
serde = { version = "1", features = ["derive"] }
# Settings are stored as RON, the format eframe uses, so a file written by
# the desktop build reads here and back.
ron = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
pob-engine = { path = "../pob-engine" }
serial_test = "4"
image = { version = "0.25", default-features = false, features = ["png"] }
